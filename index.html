<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2563eb">
<meta name="format-detection" content="telephone=no">
<title>파트너스 법인차량 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #f0f2f5;
  --card: #ffffff;
  --primary: #2563eb;
  --primary-d: #1d4ed8;
  --primary-l: #dbeafe;
  --success: #059669;
  --success-l: #d1fae5;
  --danger: #dc2626;
  --danger-l: #fee2e2;
  --warn: #d97706;
  --warn-l: #fef3c7;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { height: 100%; overscroll-behavior-y: contain; }
body {
  font-family: -apple-system, 'Pretendard', 'Apple SD Gothic Neo', BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--gray-800);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
}

/* 모바일에서 입력창 포커스 시 자동 확대 방지 (iOS는 16px 미만 입력 폰트에서 확대됨) */
input, select, textarea { font-size: 16px; }

/* ── Screen system ── */
.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ════════════════════════════════
   SCREEN 1: Login
════════════════════════════════ */
#loginScreen {
  background: linear-gradient(160deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%);
  align-items: center; justify-content: center;
  padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right))
            calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
}
.login-card {
  background: #fff;
  border-radius: 24px;
  padding: 32px 24px;
  width: 100%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.login-logo {
  text-align: center; margin-bottom: 24px;
}
.login-logo .logo-img { height: 36px; width: auto; display: block; margin: 0 auto 10px; }
.login-logo .title { font-size: 20px; font-weight: 700; color: var(--gray-800); margin-top: 4px; }
.login-logo .sub { font-size: 11px; color: var(--gray-400); margin-top: 3px; }

.user-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 14px;
}
.user-btn {
  background: var(--gray-50);
  border: 1.5px solid var(--gray-200);
  border-radius: 12px;
  padding: 12px 6px;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.user-btn:hover { border-color: var(--primary); background: var(--primary-l); }
.user-btn.selected { border-color: var(--primary); background: var(--primary-l); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
.user-btn .avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--primary); color: #fff;
  font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 6px;
}
.user-btn.selected .avatar { background: var(--primary-d); }
.user-btn .name { font-size: 12px; font-weight: 600; color: var(--gray-700); }

.login-enter-btn {
  width: 100%; background: var(--primary); color: #fff;
  border: none; border-radius: 12px; padding: 14px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  margin-top: 4px; transition: background 0.15s;
}
.login-enter-btn:hover { background: var(--primary-d); }
.login-enter-btn:active { transform: scale(0.99); }

.custom-name-wrap {
  display: none; margin-bottom: 14px;
}
.custom-name-wrap.visible { display: block; }
.custom-name-input {
  width: 100%; border: 1.5px solid var(--primary);
  border-radius: 10px; padding: 12px 14px;
  font-size: 16px; font-weight: 600; color: var(--gray-800);
  outline: none; background: var(--primary-l);
  transition: border-color 0.15s;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}
.custom-name-input::placeholder { font-weight: 400; color: var(--gray-400); }
.custom-name-input:focus { border-color: var(--primary-d); }

.login-error {
  text-align: center; color: var(--danger);
  font-size: 12px; margin-top: 8px; min-height: 18px;
}

/* ════════════════════════════════
   SCREEN 2: Main (Trip Entry)
════════════════════════════════ */
#mainScreen { background: var(--bg); }

.app-bar {
  background: var(--primary);
  padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 2px 8px rgba(37,99,235,0.3);
  position: sticky; top: 0; z-index: 50;
}
.app-bar .user-chip {
  background: rgba(255,255,255,0.2);
  border-radius: 20px; padding: 4px 10px 4px 6px;
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: #fff; font-weight: 600;
}
.app-bar .user-chip .chip-av {
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255,255,255,0.35);
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.app-bar-title { color: #fff; font-size: 15px; font-weight: 700; flex: 1; }
.app-bar-btns { display: flex; gap: 6px; }
.bar-btn {
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.28);
  color: #fff; border-radius: 7px;
  padding: 5px 10px; font-size: 11px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}

.main-body {
  flex: 1; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
  max-width: 480px; margin: 0 auto; width: 100%;
}

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 14px;
}
.card-title {
  font-size: 12px; font-weight: 700;
  color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.6px;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 6px;
}
.card-title .ct-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }

/* Info row */
.info-row {
  display: flex; gap: 10px; margin-bottom: 14px;
}
.info-chip {
  background: var(--primary-l); color: var(--primary);
  border-radius: 8px; padding: 8px 12px;
  font-size: 12px; font-weight: 600; flex: 1; text-align: center;
}
.info-chip .ic-label { font-size: 10px; color: #5b87e0; margin-bottom: 2px; }
.info-chip .ic-value { font-size: 13px; font-weight: 700; }

/* Car select */
.car-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.car-btn {
  border: 1.5px solid var(--gray-200);
  border-radius: 12px; padding: 12px 6px;
  cursor: pointer; text-align: center;
  background: var(--gray-50); transition: all 0.15s;
}
.car-btn:hover { border-color: var(--primary); background: var(--primary-l); }
.car-btn.selected { border-color: var(--primary); background: var(--primary-l); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
.car-btn .car-icon { font-size: 26px; margin-bottom: 5px; }
.car-btn .car-name { font-size: 12px; font-weight: 700; color: var(--gray-700); }
.car-btn .car-num { font-size: 10px; color: var(--gray-400); margin-top: 2px; }
.car-btn .car-last-km { font-size: 9px; color: var(--primary); font-weight: 700; margin-top: 4px; }
.car-btn.selected .car-last-km { color: var(--primary-d); }

/* Destination input */
.dest-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.dest-from {
  background: var(--gray-100); border-radius: 8px;
  padding: 10px 12px; font-size: 13px; font-weight: 600; color: var(--gray-600);
  flex: 1; text-align: center;
}
.dest-arrow { font-size: 16px; color: var(--gray-400); }
.dest-input {
  flex: 1; border: 1.5px solid var(--gray-200);
  border-radius: 8px; padding: 10px 12px;
  font-size: 16px; outline: none;
  transition: border-color 0.15s;
  min-width: 0;
}
.dest-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

/* KM manual entry */
.km-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.km-manual {
  border: 1.5px solid var(--gray-200); border-radius: 8px;
  padding: 10px 12px; font-size: 17px; font-weight: 700;
  color: var(--gray-800); width: 100%; text-align: center;
  outline: none; margin-top: 6px; background: #fff;
}
.km-manual:focus { border-color: var(--primary); }

/* Memo */
.memo-input {
  width: 100%; border: 1.5px solid var(--gray-200);
  border-radius: 8px; padding: 10px 12px;
  font-size: 16px; outline: none; background: var(--gray-50);
  transition: border-color 0.15s;
}
.memo-input:focus { border-color: var(--primary); background: #fff; }

/* Submit button */
.submit-btn {
  width: 100%; background: var(--primary); color: #fff;
  border: none; border-radius: 12px; padding: 15px;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: background 0.15s; margin-bottom: 14px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.submit-btn:hover { background: var(--primary-d); }
.submit-btn:disabled { background: var(--gray-300); cursor: not-allowed; }
.submit-btn:active:not(:disabled) { transform: scale(0.99); }

/* Distance display */
.dist-display {
  background: linear-gradient(135deg, var(--primary-l), #ede9fe);
  border: 1.5px solid #bfdbfe;
  border-radius: 12px; padding: 14px;
  text-align: center; margin-bottom: 14px;
  display: none;
}
.dist-display.visible { display: block; }
.dist-num { font-size: 32px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
.dist-unit { font-size: 14px; color: #5b87e0; font-weight: 600; }
.dist-label { font-size: 11px; color: var(--gray-500); margin-top: 3px; }

/* ════════════════════════════════
   SCREEN 3: Admin
════════════════════════════════ */
#adminScreen { background: var(--bg); }

.admin-bar {
  background: #1e293b;
  padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
  display: flex; align-items: center; gap: 10px;
}
.admin-bar-title { color: #fff; font-size: 15px; font-weight: 700; flex: 1; }

.admin-body { flex: 1; padding: 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }

.filter-row {
  display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
.filter-btn {
  background: #fff; border: 1px solid var(--gray-200);
  border-radius: 20px; padding: 5px 12px;
  font-size: 12px; font-weight: 600; color: var(--gray-600);
  cursor: pointer; transition: all 0.15s;
}
.filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.stats-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px;
}
.stat-card {
  background: #fff; border-radius: 10px; padding: 10px 8px;
  text-align: center; box-shadow: var(--shadow);
}
.sc-val { font-size: 18px; font-weight: 800; color: var(--primary); }
.sc-lbl { font-size: 9px; color: var(--gray-400); margin-top: 2px; }

/* Records table */
.rec-table-wrap { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.rec-table-head {
  background: var(--gray-800); padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px;
}
.rec-table-head span { color: #fff; font-size: 12px; font-weight: 700; }
.export-btn {
  background: #16a34a; color: #fff; border: none;
  border-radius: 6px; padding: 6px 14px; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: background 0.15s; white-space: nowrap;
}
.export-btn:hover { background: #15803d; }
.export-btn.primary { background: var(--primary); }
.export-btn.primary:hover { background: var(--primary-d); }
.export-btn.report { background: #7c3aed; }
.export-btn.report:hover { background: #6d28d9; }
.export-btn:disabled { background: var(--gray-300); cursor: not-allowed; }

.rec-list { max-height: 60vh; overflow-y: auto; }
.rec-item {
  padding: 12px 14px; border-bottom: 1px solid var(--gray-100);
  display: flex; gap: 10px; align-items: flex-start;
}
.rec-item:last-child { border-bottom: none; }
.rec-item:hover { background: var(--gray-50); }

.ri-left { min-width: 52px; text-align: center; }
.ri-date { font-size: 11px; font-weight: 700; color: var(--primary); }
.ri-time { font-size: 10px; color: var(--gray-400); margin-top: 2px; }

.ri-body { flex: 1; min-width: 0; }
.ri-user { font-size: 13px; font-weight: 700; color: var(--gray-800); }
.ri-route { font-size: 11px; color: var(--gray-500); margin-top: 2px; }
.ri-tags { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.tag {
  font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
}
.tag.car { background: var(--primary-l); color: var(--primary); }
.tag.km { background: var(--success-l); color: var(--success); }

.ri-right { text-align: right; min-width: 64px; }
.ri-km { font-size: 16px; font-weight: 800; color: var(--gray-800); }
.ri-km-u { font-size: 10px; color: var(--gray-400); }
.ri-del { background: none; border: none; color: var(--gray-300); font-size: 14px; cursor: pointer; margin-top: 4px; display: block; margin-left: auto; }
.ri-del:hover { color: var(--danger); }
.ri-approve {
  background: var(--primary); color: #fff; border: none;
  border-radius: 6px; padding: 4px 9px; font-size: 11px; font-weight: 700;
  cursor: pointer; margin-top: 6px; display: block; margin-left: auto;
}
.ri-approve:hover { background: var(--primary-d); }

/* Approval chain */
.approval-chain {
  display: flex; align-items: center; gap: 4px; margin-bottom: 10px; flex-wrap: wrap;
}
.approval-step {
  font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
  background: var(--gray-100); color: var(--gray-400);
}
.approval-step.done { background: var(--success-l); color: var(--success); }
.approval-arrow { font-size: 11px; color: var(--gray-300); }

.empty-msg { text-align: center; padding: 40px 20px; color: var(--gray-400); font-size: 13px; }

/* ── Car care checklist ── */
.care-car-card:last-child { margin-bottom: 0; }
.care-list { display: flex; flex-direction: column; }
.care-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 4px; border-bottom: 1px solid var(--gray-100);
  cursor: pointer; user-select: none;
}
.care-item:last-child { border-bottom: none; }
.care-item:hover { background: var(--gray-50); }
.care-check { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
.care-item-body { flex: 1; min-width: 0; }
.care-item-name { font-size: 13px; font-weight: 600; color: var(--gray-700); }
.care-item.done .care-item-name { color: var(--success); }
.care-item-date { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
.care-item.done .care-item-date { color: var(--success); }
.care-memo {
  width: 100%; margin-top: 10px; resize: vertical;
  font-family: inherit;
}

/* Toast */
.toast {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--gray-800); color: #fff;
  padding: 11px 20px; border-radius: 24px;
  font-size: 13px; z-index: 999;
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap; box-shadow: var(--shadow-lg);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok { background: var(--success); }
.toast.err { background: var(--danger); }

/* Admin PIN modal */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 200;
  align-items: center; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal-box {
  background: #fff; border-radius: 20px;
  padding: 28px 24px; width: 300px;
  box-shadow: var(--shadow-lg); text-align: center;
}
.modal-box h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.modal-pin-input {
  width: 100%; border: 2px solid var(--gray-200);
  border-radius: 10px; padding: 12px; font-size: 18px;
  text-align: center; letter-spacing: 2px;
  outline: none; font-weight: 700;
}
.modal-pin-input:focus { border-color: var(--primary); }
.modal-btns { display: flex; gap: 8px; margin-top: 14px; }
.modal-btn {
  flex: 1; padding: 11px; border-radius: 10px;
  font-size: 14px; font-weight: 700; cursor: pointer; border: none;
}
.modal-btn.cancel { background: var(--gray-100); color: var(--gray-600); }
.modal-btn.confirm { background: var(--primary); color: #fff; }

@media (max-width: 380px) {
  .car-btn .car-name { font-size: 11px; }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<!-- ══════════════════════════════
     SCREEN 1: LOGIN
══════════════════════════════ -->
<div class="screen active" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <img class="logo-img" src="assets/logo.png" alt="(주)파트너스종합관리">
      <div class="title">🚗 법인차량 관리</div>
      <div class="sub">법인세법 시행령 제50조의2</div>
    </div>

    <div style="font-size:11px;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;">
      사용자 선택
    </div>
    <div class="user-grid" id="userGrid"></div>

    <div class="custom-name-wrap" id="customNameWrap">
      <div style="font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px;">이름 직접 입력</div>
      <input class="custom-name-input" id="customNameInput" type="text" placeholder="성명을 입력하세요" maxlength="20" autocomplete="off">
    </div>

    <button class="login-enter-btn" id="loginEnterBtn" onclick="doLogin()">시작하기 →</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ══════════════════════════════
     SCREEN 2: MAIN (Trip Entry)
══════════════════════════════ -->
<div class="screen" id="mainScreen">
  <div class="app-bar">
    <div class="user-chip">
      <div class="chip-av" id="headerAv">-</div>
      <span id="headerName">-</span>
    </div>
    <div class="app-bar-title"></div>
    <div class="app-bar-btns">
      <button class="bar-btn" onclick="showCare()">🔧 정비</button>
      <button class="bar-btn" onclick="showAdmin()">📊 관리</button>
      <button class="bar-btn" onclick="showCeoApproval()">🖋️ 대표결재</button>
      <button class="bar-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="main-body">
    <!-- Date + From -->
    <div class="card">
      <div class="card-title"><span class="ct-dot"></span>운행 정보</div>
      <div class="info-row">
        <div class="info-chip">
          <div class="ic-label">운행일자</div>
          <div class="ic-value" id="dispDate">-</div>
        </div>
        <div class="info-chip">
          <div class="ic-label">출발지</div>
          <div class="ic-value">파트너스</div>
        </div>
        <div class="info-chip">
          <div class="ic-label">운행목적</div>
          <div class="ic-value">업무</div>
        </div>
      </div>
      <div class="dest-row">
        <div class="dest-from">파트너스</div>
        <div class="dest-arrow">→</div>
        <input class="dest-input" id="destInput" type="text" placeholder="도착지 입력" autocomplete="off">
      </div>
    </div>

    <!-- Car select -->
    <div class="card">
      <div class="card-title"><span class="ct-dot"></span>차량 선택</div>
      <div class="car-grid" id="carGrid">
        <div class="car-btn" data-car="아반떼" data-num="파트너스 아반떼" onclick="selectCar(this)">
          <div class="car-icon">🚗</div>
          <div class="car-name">아반떼</div>
          <div class="car-num">세단</div>
          <div class="car-last-km" id="carLastKm-아반떼">-</div>
        </div>
        <div class="car-btn" data-car="카니발" data-num="파트너스 카니발" onclick="selectCar(this)">
          <div class="car-icon">🚐</div>
          <div class="car-name">카니발</div>
          <div class="car-num">승합</div>
          <div class="car-last-km" id="carLastKm-카니발">-</div>
        </div>
      </div>
    </div>

    <!-- Odometer km input -->
    <div class="card">
      <div class="card-title"><span class="ct-dot"></span>출발/도착 계기수 입력</div>
      <div class="km-grid">
        <div>
          <div style="font-size:10px;color:var(--gray-400);margin-bottom:4px;text-align:center;">출발계기</div>
          <input class="km-manual" type="number" id="startKmManual" placeholder="0" step="0.1" inputmode="decimal">
        </div>
        <div>
          <div style="font-size:10px;color:var(--gray-400);margin-bottom:4px;text-align:center;">도착계기</div>
          <input class="km-manual" type="number" id="endKmManual" placeholder="0" step="0.1" inputmode="decimal">
        </div>
      </div>
    </div>

    <!-- Distance preview -->
    <div class="dist-display" id="distDisplay">
      <div class="dist-label">운행 거리 (자동 계산)</div>
      <div><span class="dist-num" id="distNum">0</span> <span class="dist-unit">km</span></div>
    </div>

    <!-- Memo -->
    <div class="card">
      <div class="card-title"><span class="ct-dot"></span>비고 (선택)</div>
      <input class="memo-input" type="text" id="memoInput" placeholder="주유, 보험처리, 정비, 세차 등">
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitTrip()">
      ✅ 운행 기록 저장
    </button>
  </div>
</div>

<!-- ══════════════════════════════
     SCREEN 3: ADMIN
══════════════════════════════ -->
<div class="screen" id="adminScreen">
  <div class="admin-bar">
    <div class="admin-bar-title">📋 운행기록 관리</div>
    <button class="bar-btn" style="background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);" onclick="showMain()">← 돌아가기</button>

<div class="screen" id="careScreen">
  <div class="admin-bar">

    <button class="bar-btn" style="background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);" onclick="showMain()">← 돌아가기</button>

  <div class="admin-body" id="careBody"></div>
</div>

<!-- ══════════════════════════════
     SCREEN 5: CEO APPROVAL (대표이사 결재)
══════════════════════════════ -->
<div class="screen" id="ceoScreen">
  <div class="admin-bar">
    <div class="admin-bar-title">🖋️ 대표이사 결재</div>

  <div class="admin-body" id="ceoBody"></div>

<!-- Admin PIN modal -->
<div class="modal-bg" id="adminModal">
  <div class="modal-box">
    <h3>🔐 관리자 PIN</h3>
    <input class="modal-pin-input" type="password" id="adminPinInput" maxlength="20" placeholder="PIN 입력" autocomplete="off">

    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeAdminModal()">취소</button>
      <button class="modal-btn confirm" onclick="checkAdminPin()">확인</button>
    </div>
  </div>
</div>

<!-- CEO PIN modal -->
<div class="modal-bg" id="ceoModal">
  <div class="modal-box">
    <h3>🔐 대표이사 PIN</h3>
    <input class="modal-pin-input" type="password" id="ceoPinInput" maxlength="20" placeholder="PIN 입력" autocomplete="off">
    <div style="font-size:11px;color:var(--danger);min-height:16px;margin-top:6px;" id="ceoPinError"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeCeoModal()">취소</button>
      <button class="modal-btn confirm" onclick="checkCeoPin()">확인</button>
    </div>
  </div>
</div>

<!-- Monthly report modal -->
<div class="modal-bg" id="reportModal">
  <div class="modal-box">
    <h3>📄 월간 보고서</h3>
    <div style="font-size:11px;color:var(--gray-500);margin-bottom:10px;">결재 현황을 포함한 PDF 보고서를 생성할 월을 선택하세요.</div>
    <input class="modal-pin-input" type="month" id="reportMonthInput" style="font-size:16px;letter-spacing:0;">
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeReportModal()">취소</button>
      <button class="modal-btn confirm" id="reportGenerateBtn" onclick="generateMonthlyReport()">생성</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
// CONFIG — 사용자·PIN 등록 (변경 필요 시 여기만)
// ═══════════════════════════════════════════════
const USERS = [
  { id: 'u1', name: '황윤호', rank: '' },
  { id: 'u2', name: '박동의', rank: '' },
  { id: 'u3', name: '최재우', rank: '' },
  { id: 'u4', name: '유병옥', rank: '' },
  { id: 'u5', name: '박성호', rank: '' },
  { id: 'u6', name: '직접입력', rank: '' },
];
const ADMIN_PIN = 'admin1234!'; // 관리자 PIN
const CEO_PIN = 'admin1234!'; // 대표이사 PIN
const FROM_PLACE = '파트너스';
const CAR_NUMS = { '아반떼': '12가3456', '카니발': '34나5678' }; // 실제 번호로 교체

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let currentUser = null;
let selectedUser = null;
let selectedCar = null;
let records = [];

function loadRecords() {
  try { records = JSON.parse(localStorage.getItem('atf_mileage') || '[]'); } catch(e) { records = []; }
}
function saveRecords() {
  try { localStorage.setItem('atf_mileage', JSON.stringify(records)); } catch(e) {
    toast('저장 공간 부족. 엑셀 내보내기 후 초기화하세요.', 'err');
  }
}

// ═══════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════
function buildLogin() {
  const grid = document.getElementById('userGrid');
  grid.innerHTML = USERS.map(u => {
    const isCustom = u.id === 'u6';
    const av = isCustom ? '✏️' : u.name[0];
    const sub = isCustom ? '이름 직접 입력' : u.rank;
    const avStyle = isCustom ? 'background:var(--gray-400);font-size:18px;' : '';
    return `<div class="user-btn" data-id="${u.id}" onclick="selectUser('${u.id}')">
      <div class="avatar" style="${avStyle}">${av}</div>
      <div class="name">${u.name}</div>
      <div style="font-size:10px;color:var(--gray-400);margin-top:2px;">${sub}</div>
    </div>`;
  }).join('');
}

function selectUser(id) {
  selectedUser = USERS.find(u => u.id === id);
  document.querySelectorAll('.user-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.id === id);
  });
  document.getElementById('loginError').textContent = '';
  const isCustom = id === 'u6';
  const wrap = document.getElementById('customNameWrap');
  wrap.classList.toggle('visible', isCustom);
  if (isCustom) {
    setTimeout(() => document.getElementById('customNameInput').focus(), 100);
  }
}

function doLogin() {
  if (!selectedUser) {
    document.getElementById('loginError').textContent = '사용자를 선택하세요.';
    return;
  }
  if (selectedUser.id === 'u6') {
    const name = document.getElementById('customNameInput').value.trim();
    if (!name) {
      document.getElementById('loginError').textContent = '이름을 입력하세요.';
      document.getElementById('customNameInput').focus();
      return;
    }
    currentUser = { id: 'custom_' + Date.now(), name, rank: '직접입력' };
  } else {
    currentUser = { ...selectedUser };
  }
  goMain();
}

function logout() {
  currentUser = null; selectedUser = null; selectedCar = null;
  resetForm();
  show('loginScreen');
  document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('customNameWrap').classList.remove('visible');
  document.getElementById('customNameInput').value = '';
  document.getElementById('loginError').textContent = '';
}

// ═══════════════════════════════════════════════
// MAIN SCREEN
// ═══════════════════════════════════════════════
function goMain() {
  resetForm();
  const now = new Date();
  document.getElementById('dispDate').textContent =
    `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  const rankLabel = currentUser.rank && currentUser.rank !== '직접입력' ? ` ${currentUser.rank}` : '';
  document.getElementById('headerName').textContent = currentUser.name + rankLabel;
  document.getElementById('headerAv').textContent = currentUser.name[0];
  show('mainScreen');
  renderCarLastKm();
  loadRecordsFromCloud().then(renderCarLastKm);
}

function renderCarLastKm() {
  Object.keys(CAR_NUMS).forEach(car => {
    const last = lastRecordForCar(car);
    const el = document.getElementById('carLastKm-' + car);
    if (!el) return;
    el.textContent = last ? `최근 도착 ${last.endKm.toLocaleString()}km` : '기록 없음';
  });
}

function selectCar(el) {
  document.querySelectorAll('.car-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedCar = el.dataset.car;

  // 편의성: 최근 도착계기를 출발계기에 자동 입력
  const last = lastRecordForCar(selectedCar);
  document.getElementById('startKmManual').value = last ? last.endKm : '';
  updateDistDisplay();
}

function lastRecordForCar(car) {
  return records
    .filter(r => r.car === car)
    .sort((a,b) => new Date(b.datetime) - new Date(a.datetime))[0];
}

function resetForm() {
  selectedCar = null;
  document.querySelectorAll('.car-btn').forEach(b => b.classList.remove('selected'));
  ['startKmManual','endKmManual','destInput','memoInput'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('distDisplay').classList.remove('visible');
}

function updateDistDisplay() {
  const startVal = parseFloat(document.getElementById('startKmManual').value);
  const endVal = parseFloat(document.getElementById('endKmManual').value);
  if (startVal > 0 && endVal > 0 && endVal >= startVal) {
    const dist = Math.round((endVal - startVal) * 10) / 10;
    document.getElementById('distNum').textContent = dist;
    document.getElementById('distDisplay').classList.add('visible');
  }
}

document.getElementById('startKmManual').addEventListener('input', updateDistDisplay);
document.getElementById('endKmManual').addEventListener('input', updateDistDisplay);

// ═══════════════════════════════════════════════
// SUBMIT TRIP
// ═══════════════════════════════════════════════
function submitTrip() {
  if (!selectedCar) { toast('차량을 선택하세요.', 'err'); return; }
  const dest = document.getElementById('destInput').value.trim();
  if (!dest) { toast('도착지를 입력하세요.', 'err'); return; }

  const startKm = parseFloat(document.getElementById('startKmManual').value);
  const endKm   = parseFloat(document.getElementById('endKmManual').value);
  if (!startKm || startKm <= 0) { toast('출발 계기 수치를 입력하세요.', 'err'); return; }
  if (!endKm   || endKm   <= 0) { toast('도착 계기 수치를 입력하세요.', 'err'); return; }
  if (endKm < startKm) { toast('도착 계기가 출발 계기보다 작습니다.', 'err'); return; }

  const now = new Date();
  const distance = Math.round((endKm - startKm) * 10) / 10;

  const record = {
    id: Date.now(),
    userId: currentUser.id,
    userName: currentUser.name,
    userRank: currentUser.rank || '',
    date: now.toISOString().split('T')[0],
    time: now.toTimeString().slice(0,5),
    datetime: now.toISOString(),
    from: FROM_PLACE,
    to: dest,
    car: selectedCar,
    carNum: CAR_NUMS[selectedCar] || '',
    startKm,
    endKm,
    distance,
    purpose: '업무',
    memo: document.getElementById('memoInput').value.trim(),
    approval: {
      staffName: currentUser.name,
      staffDate: todayStr(),
      managerName: '',
      managerDate: '',
      ceoName: '',
      ceoDate: ''
    }
  };

  records.unshift(record);
  saveRecords(); // localStorage cache
  renderCarLastKm();
  // Cloud save
  saveRecordToCloud(record).then(ok => {
    if (ok) toast(`✅ ${distance}km 운행 기록 저장 완료! ☁️`, 'ok');
  });
  resetForm();
  document.getElementById('distDisplay').classList.remove('visible');
}

// ═══════════════════════════════════════════════
// ADMIN
// ═══════════════════════════════════════════════
function showAdmin() {
  document.getElementById('adminPinError').textContent = '';
  document.getElementById('adminPinInput').value = '';
  document.getElementById('adminModal').classList.add('open');
  setTimeout(() => document.getElementById('adminPinInput').focus(), 100);
}
document.getElementById('adminPinInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkAdminPin();
});
function closeAdminModal() {
  document.getElementById('adminModal').classList.remove('open');
}
function checkAdminPin() {
  const val = document.getElementById('adminPinInput').value;
  if (val === ADMIN_PIN) {
    closeAdminModal();
    renderAdmin('all');
    show('adminScreen');
  } else {
    document.getElementById('adminPinError').textContent = '❌ PIN이 올바르지 않습니다.';
  }
}
function showMain() { show('mainScreen'); }

// ═══════════════════════════════════════════════
// CEO APPROVAL (대표이사 결재)
// ═══════════════════════════════════════════════
function showCeoApproval() {
  document.getElementById('ceoPinError').textContent = '';
  document.getElementById('ceoPinInput').value = '';
  document.getElementById('ceoModal').classList.add('open');
  setTimeout(() => document.getElementById('ceoPinInput').focus(), 100);
}
document.getElementById('ceoPinInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkCeoPin();
});
function closeCeoModal() {
  document.getElementById('ceoModal').classList.remove('open');
}
function checkCeoPin() {
  const val = document.getElementById('ceoPinInput').value;
  if (val === CEO_PIN) {
    closeCeoModal();
    renderCeo();
    show('ceoScreen');
  } else {
    document.getElementById('ceoPinError').textContent = '❌ PIN이 올바르지 않습니다.';
  }
}

function renderCeo() {
  document.getElementById('ceoBody').innerHTML = '<div class="empty-msg">☁️ 결재 대기 목록 불러오는 중...</div>';
  loadRecordsFromCloud().then(() => { _renderCeoUI(); });
}

let currentCeoPending = [];

function _renderCeoUI() {
  const pending = records.filter(r => r.approval?.managerDate && !r.approval?.ceoDate);
  currentCeoPending = pending;
  const done = records.filter(r => r.approval?.ceoDate)
    .sort((a,b) => new Date(b.approval.ceoDate) - new Date(a.approval.ceoDate))
    .slice(0, 10);

  const renderItem = (r, withBtn) => `
    <div class="rec-item">
      <div class="ri-left">
        <div class="ri-date">${r.date ? r.date.slice(5).replace('-','/') : '-'}</div>
        <div class="ri-time">${r.time || '-'}</div>
      </div>
      <div class="ri-body">
        <div class="ri-user">${r.userName}${r.userRank && r.userRank !== '직접입력' ? ' <span style="font-size:10px;font-weight:500;color:var(--gray-400);">' + r.userRank + '</span>' : ''}</div>
        <div class="ri-route">${r.from} → ${r.to}</div>
        <div class="ri-tags">
          <span class="tag car">🚗 ${r.car}</span>
          <span class="tag km">📏 ${r.startKm}→${r.endKm}km</span>
          ${r.memo ? `<span class="tag" style="background:var(--gray-100);color:var(--gray-600);">${r.memo}</span>` : ''}
        </div>
        ${approvalChainHtml(r)}
      </div>
      <div class="ri-right">
        <div class="ri-km">${r.distance}</div>
        <div class="ri-km-u">km</div>
        ${withBtn ? `<button class="ri-approve" onclick="approveCeo(${r.id})">결재</button>` : ''}
      </div>
    </div>`;

  document.getElementById('ceoBody').innerHTML = `
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="rec-table-head">
        <span>🖋️ 결재 대기 ${pending.length}건</span>
        ${pending.length ? '<button class="export-btn primary" onclick="bulkApproveCeo()">✅ 일괄 결재</button>' : ''}
      </div>
      <div class="rec-list">
        ${pending.length ? pending.map(r => renderItem(r, true)).join('') : '<div class="empty-msg">📭 결재 대기 중인 운행기록이 없습니다.</div>'}
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="rec-table-head"><span>✅ 최근 결재완료</span></div>
      <div class="rec-list">
        ${done.length ? done.map(r => renderItem(r, false)).join('') : '<div class="empty-msg">결재완료 기록이 없습니다.</div>'}
      </div>
    </div>`;
}

async function approveCeo(id) {
  const r = records.find(x => x.id === id);
  if (!r || !r.approval?.managerDate) return;
  r.approval.ceoName = currentUser?.name || '대표이사';
  r.approval.ceoDate = todayStr();
  await saveRecordToCloud(r);
  saveRecords();
  _renderCeoUI();
  toast('대표이사 결재 완료', 'ok');
}

async function bulkApproveCeo() {
  const targets = currentCeoPending;
  if (!targets.length) { toast('결재할 기록이 없습니다.', 'err'); return; }
  if (!confirm(`${targets.length}건을 일괄 결재하시겠습니까?`)) return;

  const name = currentUser?.name || '대표이사';
  const date = todayStr();
  for (const r of targets) {
    r.approval.ceoName = name;
    r.approval.ceoDate = date;
  }
  await Promise.all(targets.map(r => saveRecordToCloud(r)));
  saveRecords();
  _renderCeoUI();
  toast(`${targets.length}건 일괄 결재 완료`, 'ok');
}

let currentAdminFilter = 'all';
let currentFilteredRecords = [];

function renderAdmin(filter) {
  // show loading state
  document.getElementById('recList').innerHTML = '<div class="empty-msg">☁️ 데이터 불러오는 중...</div>';
  loadRecordsFromCloud().then(() => {
    _renderAdminUI(filter);
  });
}
function _renderAdminUI(filter) {
  currentAdminFilter = filter;
  // Filter buttons
  const filters = [
    { key: 'all', label: '전체' },
    { key: 'today', label: '오늘' },
    { key: 'week', label: '이번 주' },
    { key: 'month', label: '이번 달' },
    ...USERS.filter(u => u.id !== 'u6').map(u => ({ key: u.id, label: u.name + (u.rank ? ' '+u.rank : '') }))
  ];
  document.getElementById('filterRow').innerHTML = filters.map(f =>
    `<div class="filter-btn${filter===f.key?' active':''}" onclick="_renderAdminUI('${f.key}')">${f.label}</div>`
  ).join('');

  // Apply filter
  const now = new Date();
  const todayStr = now.toISOString().split('T')[0];
  const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay());
  let filtered = records;
  if (filter === 'today') filtered = records.filter(r => r.date === todayStr);
  else if (filter === 'week') filtered = records.filter(r => new Date(r.date) >= weekStart);
  else if (filter === 'month') filtered = records.filter(r => r.date && r.date.startsWith(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`));
  else if (filter !== 'all') filtered = records.filter(r => r.userId === filter);
  currentFilteredRecords = filtered;

  // Stats
  const totalKm = filtered.reduce((s,r) => s + (r.distance||0), 0);
  const pendingCount = filtered.filter(r => !r.approval?.ceoDate).length;
  const carCounts = {};
  filtered.forEach(r => { carCounts[r.car] = (carCounts[r.car]||0)+1; });
  const topCar = Object.entries(carCounts).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="sc-val">${filtered.length}</div><div class="sc-lbl">건수</div></div>
    <div class="stat-card"><div class="sc-val">${Math.round(totalKm*10)/10}</div><div class="sc-lbl">총 km</div></div>
    <div class="stat-card"><div class="sc-val">${topCar?topCar[0]:'-'}</div><div class="sc-lbl">최다 차량</div></div>
    <div class="stat-card"><div class="sc-val">${pendingCount}</div><div class="sc-lbl">결재대기</div></div>`;

  document.getElementById('recCountLabel').textContent = `${filter==='all'?'전체':''} ${filtered.length}건`;

  if (filtered.length === 0) {
    document.getElementById('recList').innerHTML = '<div class="empty-msg">📭 해당 기간에 운행 기록이 없습니다.</div>';
    return;
  }

  document.getElementById('recList').innerHTML = filtered.map(r => `
    <div class="rec-item">
      <div class="ri-left">
        <div class="ri-date">${r.date ? r.date.slice(5).replace('-','/') : '-'}</div>
        <div class="ri-time">${r.time || '-'}</div>
      </div>
      <div class="ri-body">
        <div class="ri-user">${r.userName}${r.userRank && r.userRank !== '직접입력' ? ' <span style="font-size:10px;font-weight:500;color:var(--gray-400);">' + r.userRank + '</span>' : ''}</div>
        <div class="ri-route">${r.from} → ${r.to}</div>
        <div class="ri-tags">
          <span class="tag car">🚗 ${r.car}</span>
          <span class="tag km">📏 ${r.startKm}→${r.endKm}km</span>
          ${r.memo ? `<span class="tag" style="background:var(--gray-100);color:var(--gray-600);">${r.memo}</span>` : ''}
        </div>
        ${approvalChainHtml(r)}
      </div>
      <div class="ri-right">
        <div class="ri-km">${r.distance}</div>
        <div class="ri-km-u">km</div>
        ${!r.approval?.managerDate ? `<button class="ri-approve" onclick="approveManager(${r.id})">관리자 승인</button>` : ''}
        <button class="ri-del" onclick="deleteRecord(${r.id})">✕</button>
      </div>
    </div>`).join('');
}

function approvalChainHtml(r) {
  const a = r.approval || {};
  const steps = [
    { label: '담당자', done: true },
    { label: '관리자', done: !!a.managerDate },
    { label: '대표이사', done: !!a.ceoDate }
  ];
  return `<div class="approval-chain" style="margin-top:6px;margin-bottom:0;">
    ${steps.map((s,i) => `${i>0?'<span class="approval-arrow">→</span>':''}<span class="approval-step${s.done?' done':''}">${s.done?'✓ ':''}${s.label}</span>`).join('')}
  </div>`;
}

async function approveManager(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  if (!r.approval) r.approval = { staffName: r.userName || '', staffDate: r.date || '', managerName: '', managerDate: '', ceoName: '', ceoDate: '' };
  r.approval.managerName = currentUser?.name || '관리자';
  r.approval.managerDate = todayStr();
  await saveRecordToCloud(r);
  saveRecords();
  _renderAdminUI(currentAdminFilter);
  toast('관리자 승인 완료', 'ok');
}

async function bulkApproveManager() {
  const targets = currentFilteredRecords.filter(r => !r.approval?.managerDate);
  if (!targets.length) { toast('승인할 기록이 없습니다.', 'err'); return; }
  if (!confirm(`${targets.length}건을 일괄 승인하시겠습니까?`)) return;

  const name = currentUser?.name || '관리자';
  const date = todayStr();
  for (const r of targets) {
    if (!r.approval) r.approval = { staffName: r.userName || '', staffDate: r.date || '', managerName: '', managerDate: '', ceoName: '', ceoDate: '' };
    r.approval.managerName = name;
    r.approval.managerDate = date;
  }
  await Promise.all(targets.map(r => saveRecordToCloud(r)));
  saveRecords();
  _renderAdminUI(currentAdminFilter);
  toast(`${targets.length}건 일괄 승인 완료`, 'ok');
}

function deleteRecord(id) {
  if (!confirm('이 기록을 삭제하시겠습니까?')) return;
  records = records.filter(r => r.id !== id);
  saveRecords();
  deleteRecordFromCloud(id);
  renderAdmin('all');
  toast('삭제되었습니다.');
}

// ═══════════════════════════════════════════════
const CARE_ITEMS = [
  { key: 'engineOil', icon: '🛢️', label: '엔진오일 교체' },
  { key: 'tire',      icon: '🛞', label: '타이어 마모/공기압 점검' },
  { key: 'battery',   icon: '🔋', label: '배터리 점검' },
  { key: 'brake',     icon: '🛑', label: '브레이크 패드/오일 점검' },
  { key: 'coolant',   icon: '💧', label: '냉각수 점검' },
  { key: 'inspection',icon: '📋', label: '자동차 정기검사' },
];
let careData = {}; // { [car]: { items: { [key]: {done, date} }, memo } }

function showCare() {
  document.getElementById('careBody').innerHTML = '<div class="empty-msg">☁️ 정비 기록 불러오는 중...</div>';
  show('careScreen');
  loadCareFromCloud().then(renderCare);
}

function renderCare() {
  document.getElementById('careBody').innerHTML = Object.keys(CAR_NUMS).map(car => {
    const cd = careData[car] || { items: {}, memo: '' };
    const itemsHtml = CARE_ITEMS.map(it => {
      const st = cd.items[it.key] || {};
      const done = !!st.done;
      return `<div class="care-item${done ? ' done' : ''}" onclick="toggleCareItem('${car}','${it.key}')">
        <div class="care-check">${done ? '✅' : '⬜'}</div>
        <div class="care-item-body">
          <div class="care-item-name">${it.icon} ${it.label}</div>
          <div class="care-item-date">${done && st.date ? '완료: ' + st.date : '미실시'}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="card care-car-card">
      <div class="card-title"><span class="ct-dot"></span>${car} <span style="font-weight:400;color:var(--gray-400);">(${CAR_NUMS[car] || ''})</span></div>
      <div class="care-list">${itemsHtml}</div>
      <textarea class="memo-input care-memo" rows="2" placeholder="정비 관련 비고" onblur="updateCareMemo('${car}', this.value)">${cd.memo || ''}</textarea>
    </div>`;
  }).join('');
}

function toggleCareItem(car, key) {
  if (!careData[car]) careData[car] = { items: {}, memo: '' };
  const cur = careData[car].items[key] || {};
  careData[car].items[key] = cur.done
    ? { done: false, date: cur.date || '' }
    : { done: true, date: todayStr() };
  renderCare();
  saveCareToCloud(car);
}

function updateCareMemo(car, value) {
  if (!careData[car]) careData[car] = { items: {}, memo: '' };
  careData[car].memo = value;
  saveCareToCloud(car);
}

function todayStr() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

// EXCEL EXPORT
// ═══════════════════════════════════════════════
function exportExcel() {
  if (records.length === 0) { toast('내보낼 기록이 없습니다.', 'err'); return; }

  const sorted = [...records].sort((a,b) => new Date(a.datetime) - new Date(b.datetime));

  // Sheet 1: 운행일지
  const rows = sorted.map((r, i) => ({
    '번호': i+1,
    '운행일자': r.date,
    '기록시각': r.time,
    '운전자': r.userName + (r.userRank && r.userRank !== '직접입력' ? ' ' + r.userRank : ''),
    '차량명': r.car,
    '차량번호': r.carNum || '',
    '출발지': r.from,
    '도착지': r.to,
    '운행목적': r.purpose || '업무',
    '출발계기(km)': r.startKm,
    '도착계기(km)': r.endKm,
    '운행거리(km)': r.distance,
    '비고': r.memo || '',
    '관리자승인': r.approval?.managerDate ? `${r.approval.managerName} (${r.approval.managerDate})` : '',
    '대표이사결재': r.approval?.ceoDate ? `${r.approval.ceoName} (${r.approval.ceoDate})` : ''
  }));

  // Sheet 2: 월별 집계
  const byMonth = {};
  sorted.forEach(r => {
    const m = r.date ? r.date.slice(0,7) : '미상';
    if (!byMonth[m]) byMonth[m] = { km: 0, count: 0 };
    byMonth[m].km += r.distance || 0;
    byMonth[m].count++;
  });
  const monthRows = Object.entries(byMonth).map(([m,v]) => ({
    '연월': m,
    '운행건수': v.count,
    '총거리(km)': Math.round(v.km*10)/10
  }));

  // Sheet 3: 사용자별 집계
  const byUser = {};
  sorted.forEach(r => {
    if (!byUser[r.userName]) byUser[r.userName] = { km: 0, count: 0 };
    byUser[r.userName].km += r.distance || 0;
    byUser[r.userName].count++;
  });
  const userRows = Object.entries(byUser).map(([u,v]) => ({
    '운전자': u,
    '운행건수': v.count,
    '총거리(km)': Math.round(v.km*10)/10,
    '평균거리(km)': Math.round((v.km/v.count)*10)/10
  }));

  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(rows);
  ws1['!cols'] = [
    {wch:5},{wch:12},{wch:8},{wch:10},{wch:8},{wch:14},{wch:12},{wch:16},
    {wch:8},{wch:12},{wch:12},{wch:12},{wch:20},{wch:20},{wch:20}
  ];
  const ws2 = XLSX.utils.json_to_sheet(monthRows);
  const ws3 = XLSX.utils.json_to_sheet(userRows);
  XLSX.utils.book_append_sheet(wb, ws1, '운행일지');
  XLSX.utils.book_append_sheet(wb, ws2, '월별집계');
  XLSX.utils.book_append_sheet(wb, ws3, '사용자별집계');

  const now = new Date();
  const fname = `파트너스_운행일지_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.xlsx`;
  XLSX.writeFile(wb, fname);
  toast(`📊 엑셀 저장 완료`, 'ok');
}

// MONTHLY REPORT (PDF) — 관리자/대표이사 결재 현황 보고서
// ═══════════════════════════════════════════════
function showReportModal() {
  const now = new Date();
  document.getElementById('reportMonthInput').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('reportModal').classList.add('open');
}
function closeReportModal() {
  document.getElementById('reportModal').classList.remove('open');
}

async function generateMonthlyReport() {
  const ym = document.getElementById('reportMonthInput').value; // 'YYYY-MM'
  if (!ym) { toast('월을 선택하세요.', 'err'); return; }

  const btn = document.getElementById('reportGenerateBtn');
  btn.disabled = true;
  btn.textContent = '생성 중...';

  let container;
  try {
    await loadRecordsFromCloud();
    const monthRecords = records
      .filter(r => r.date && r.date.startsWith(ym))
      .sort((a,b) => new Date(a.datetime) - new Date(b.datetime));

    if (!monthRecords.length) {
      toast('해당 월에 운행기록이 없습니다.', 'err');
      return;
    }

    container = document.createElement('div');
    container.style.cssText = 'position:fixed;left:-9999px;top:0;width:800px;background:#fff;';
    container.innerHTML = buildReportHtml(ym, monthRecords);
    document.body.appendChild(container);

    const canvas = await html2canvas(container, { scale: 2, backgroundColor: '#ffffff' });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const imgWidth = 210;
    const pageHeight = 297;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const imgData = canvas.toDataURL('image/png');

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    pdf.save(`파트너스_월간결재보고서_${ym.replace('-','')}.pdf`);
    closeReportModal();
    toast('📄 월간 보고서 PDF 생성 완료', 'ok');
  } catch(e) {
    console.error('Report generation error:', e);
    toast('⚠️ 보고서 생성 실패', 'err');
  } finally {
    if (container) document.body.removeChild(container);
    btn.disabled = false;
    btn.textContent = '생성';
  }
}

function buildReportHtml(ym, list) {
  const [y, m] = ym.split('-');
  const totalKm = list.reduce((s,r) => s + (r.distance||0), 0);
  const ceoDone = list.filter(r => r.approval?.ceoDate).length;
  const pendingCount = list.length - ceoDone;
  const completeRate = list.length ? Math.round((ceoDone / list.length) * 100) : 0;
  const managerNames = [...new Set(list.filter(r => r.approval?.managerDate).map(r => r.approval.managerName))];
  const ceoNames = [...new Set(list.filter(r => r.approval?.ceoDate).map(r => r.approval.ceoName))];

  const summary = [
    ['총 운행건수', list.length + '건'],
    ['총 주행거리', Math.round(totalKm*10)/10 + 'km'],
    ['결재완료', ceoDone + '건'],
    ['결재대기', pendingCount + '건'],
    ['결재완료율', completeRate + '%']
  ];

  const rowsHtml = list.map((r, i) => `
    <tr>
      <td style="text-align:center;">${i+1}</td>
      <td style="text-align:center;">${r.date}</td>
      <td style="text-align:center;">${r.userName}</td>
      <td style="text-align:center;">${r.car}</td>
      <td>${r.from} → ${r.to}</td>
      <td style="text-align:right;">${r.distance}</td>
      <td style="text-align:center;">${r.approval?.managerDate ? `${r.approval.managerName}<br><span style="color:#9ca3af;font-size:9px;">${r.approval.managerDate}</span>` : '-'}</td>
      <td style="text-align:center;">${r.approval?.ceoDate ? `${r.approval.ceoName}<br><span style="color:#9ca3af;font-size:9px;">${r.approval.ceoDate}</span>` : '-'}</td>
      <td style="text-align:center;">${r.approval?.ceoDate ? '<span style="color:#059669;font-weight:700;">완료</span>' : '<span style="color:#d97706;font-weight:700;">대기</span>'}</td>
    </tr>`).join('');

  return `
    <style>
      .rpt-table { width:100%; border-collapse:collapse; font-size:11px; }
      .rpt-table th, .rpt-table td { border:1px solid #e5e7eb; padding:6px; }
      .rpt-table thead tr { background:#1f2937; color:#fff; }
    </style>
    <div style="font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1f2937;padding:32px;">
      <div style="text-align:center;margin-bottom:24px;">
        <div style="font-size:13px;color:#6b7280;font-weight:600;letter-spacing:1px;">파트너스</div>
        <div style="font-size:22px;font-weight:800;margin-top:6px;">${y}년 ${parseInt(m,10)}월 법인차량 운행 결재 보고서</div>
        <div style="font-size:11px;color:#9ca3af;margin-top:6px;">생성일: ${todayStr()}</div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:20px;">
        ${summary.map(([label, val]) => `
          <div style="flex:1;border:1px solid #e5e7eb;border-radius:8px;padding:10px;text-align:center;">
            <div style="font-size:17px;font-weight:800;color:#2563eb;">${val}</div>
            <div style="font-size:10px;color:#9ca3af;margin-top:2px;">${label}</div>
          </div>`).join('')}
      </div>

      <table class="rpt-table">
        <thead>
          <tr>
            <th>번호</th><th>날짜</th><th>운전자</th><th>차량</th><th>구간</th>
            <th>거리(km)</th><th>관리자승인</th><th>대표이사결재</th><th>상태</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>

      <div style="display:flex;gap:20px;font-size:11px;color:#4b5563;">
        <div>관리자 결재자: ${managerNames.length ? managerNames.join(', ') : '-'}</div>
        <div>대표이사 결재자: ${ceoNames.length ? ceoNames.join(', ') : '-'}</div>
      </div>
    </div>`;
}

async function saveRecordToCloud(record) {
  try {
    await db.collection('mileage').doc(String(record.id)).set(record);
    return true;
  } catch(e) {
    console.error('Cloud save error:', e);
    toast('⚠️ 클라우드 저장 실패. 로컬에만 저장됩니다.', 'err');
    return false;
  }
}

async function loadRecordsFromCloud() {
  try {
    const snap = await db.collection('mileage').orderBy('datetime', 'desc').get();
    records = snap.docs.map(d => d.data());
    // also update localStorage as cache
    localStorage.setItem('atf_mileage', JSON.stringify(records));
    return true;
  } catch(e) {
    console.error('Cloud load error:', e);
    // fallback to localStorage
    loadRecords();
    return false;
  }
}

async function deleteRecordFromCloud(id) {
  try {
    await db.collection('mileage').doc(String(id)).delete();
  } catch(e) {
    console.error('Cloud delete error:', e);
  }
}

async function loadCareFromCloud() {
  try {
    const snap = await db.collection('carcare').get();
    careData = {};
    snap.docs.forEach(d => { careData[d.id] = d.data(); });
  } catch(e) {
    console.error('Care load error:', e);
    toast('⚠️ 정비 기록을 불러오지 못했습니다.', 'err');
  }
}

async function saveCareToCloud(car) {

  } catch(e) {
    console.error('Care save error:', e);
    toast('⚠️ 정비 기록 저장 실패', 'err');
  }
}
